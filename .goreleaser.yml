version: 2

project_name: opc

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: opc
    ldflags:
      - -s -w
      - -X github.com/opscompanion/opc/cmd.Version={{.Version}}
      - -X github.com/opscompanion/opc/cmd.Commit={{.ShortCommit}}
      - -X github.com/opscompanion/opc/cmd.Date={{.Date}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz


checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
